<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard · Youngpreneur Kepri 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F3;--s:#fff;--ink:#10213F;--mut:#5B6678;--line:#E2E7DC;--navy:#10213F;--g:#147A40;--gbg:#E3F3EA;--y:#FFC531;--err:#B3123A;--ebg:#FCE5EB;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
html{background:var(--navy);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--y)}
.in,.shell{max-width:1000px;margin:0 auto}
.in{padding:18px 16px 18px;display:grid;gap:14px}
.eb{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.top h1{font-size:clamp(1.4rem,5vw,1.8rem);font-weight:800;line-height:1.15;margin-top:2px}
#who{margin-top:6px;font-size:.82rem;color:rgba(255,255,255,.7);overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{font:700 .9rem "Plus Jakarta Sans",system-ui,sans-serif;min-height:46px;padding:8px 12px;border-radius:12px;border:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.btn:disabled{opacity:.55;cursor:default}
.pri{background:var(--y);color:var(--ink)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.top .ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.dng{background:var(--err);color:#fff}
.shell{padding:16px 16px 80px}
.quota{background:var(--navy);color:#fff;border-radius:20px;padding:18px 20px}
.quota span{display:block;font-size:.88rem;font-weight:600;color:rgba(255,255,255,.75)}
.qn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.qn b{font-size:2.8rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.qn small{font-size:1rem;color:rgba(255,255,255,.75)}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--y);transition:width .4s}.meter.full i{background:#FF8AA6}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.st{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.st b{display:block;font-size:1.6rem;font-weight:800;line-height:1.15}.st span{font-size:.84rem;font-weight:600;color:var(--mut)}
.rs{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.rs>div{display:flex;align-items:center;gap:12px;min-width:0}.rs b{display:block;font-size:.95rem;line-height:1.3}.rs p{font-size:.82rem;color:var(--mut)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--mut)}
.rs[data-s=open] .dot{background:var(--g);box-shadow:0 0 0 4px var(--gbg)}.rs[data-s=closed] .dot{background:var(--err);box-shadow:0 0 0 4px var(--ebg)}
.tools{margin-top:16px;display:grid;gap:10px}
.sf input{width:100%;height:50px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:var(--s);border:2px solid var(--line);border-radius:14px}
.sf input:focus-visible{outline:none;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 .86rem "Plus Jakarta Sans",system-ui,sans-serif;height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--s);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}.chip i{font-style:normal;opacity:.7}
#cnt{font-size:.84rem;color:var(--mut)}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}.counts{grid-template-columns:repeat(4,1fr)}.acts{grid-template-columns:repeat(3,auto);justify-content:start}.in{grid-template-columns:1fr auto;align-items:end}}
.reg{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px 20px;box-shadow:inset 5px 0 0 var(--c,var(--g));display:grid;gap:8px}
.reg[data-i=baru]{--c:var(--y)}
.r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.reg h3{font-size:1.05rem;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.kode{flex:none;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--navy);color:var(--y);letter-spacing:.04em}
.reg p{font-size:.88rem;color:var(--mut);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--gbg);color:var(--g)}.tags span.b{background:#FFF1C9;color:#6B4E00}
.wa{color:var(--ink);font-weight:800;text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:3px;padding:4px 0;display:inline-block}
.r3{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.r3 small{font-size:.8rem;color:var(--mut)}
.del{background:transparent;color:var(--err);min-height:40px;padding:6px 12px}
.empty{background:var(--s);border:2px dashed var(--line);border-radius:18px;padding:36px 16px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:22px;padding:0;width:min(420px,calc(100vw - 32px));background:var(--s);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(16,33,63,.6)}
.dg{padding:22px 20px}.dg h2{font-size:1.2rem;font-weight:800}.dg p{margin-top:8px;color:var(--mut)}
.dgb{display:flex;gap:10px;margin-top:20px}.dgb .btn{flex:1}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:420px;margin:0 auto;padding:12px 16px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:.92rem;text-align:center}
#toast.err{background:var(--err)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div><p class="eb">Dashboard Admin</p><h1>Youngpreneur Kepri 2026</h1><p id="who">Memuat...</p></div>
  <div class="acts">
    <button class="btn ghost" id="refresh" type="button">Muat ulang</button>
    <button class="btn pri" id="csv" type="button">Unduh CSV</button>
    <button class="btn ghost" id="out" type="button">Keluar</button>
  </div>
</div></header>

<main class="shell">
  <section class="quota" aria-label="Kuota">
    <span>Peserta terdaftar</span>
    <div class="qn"><b id="qT">0</b><small>dari <span id="qK" style="display:inline;color:inherit;font-weight:700">24</span> slot · sisa <span id="qS" style="display:inline;color:inherit;font-weight:700">24</span></small></div>
    <div class="meter" id="meter"><i id="meterI"></i></div>
  </section>
  <section class="counts" aria-label="Ringkasan">
    <div class="st"><b id="cMhs">0</b><span>Mahasiswa</span></div>
    <div class="st"><b id="cSmk">0</b><span>Siswa/i SMK</span></div>
    <div class="st"><b id="cPunya">0</b><span>Sudah punya usaha</span></div>
    <div class="st"><b id="cTertarik">0</b><span>Belum, tapi tertarik</span></div>
  </section>
  <section class="rs" id="rs" data-s="">
    <div><span class="dot"></span><div><b id="rsT">Memuat status...</b><p id="rsP"></p></div></div>
    <button class="btn ghost" id="toggle" type="button" disabled>...</button>
  </section>

  <section class="tools">
    <div class="sf"><input id="q" type="search" placeholder="Cari nama, kampus, kode, atau WA" autocomplete="off" aria-label="Cari peserta"></div>
    <div class="chips" id="chips"></div>
    <p id="cnt" aria-live="polite"></p>
  </section>
  <ul class="list" id="list"></ul>
</main>

<dialog id="dlg"><div class="dg"><h2 id="dT"></h2><p id="dB"></p><div class="dgb"><button class="btn ghost" id="dNo" type="button">Batal</button><button class="btn dng" id="dYes" type="button">Ya</button></div></div></dialog>
<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL="https://sfnguqjpjcwdlpydelhk.supabase.co";
  var SUPABASE_ANON_KEY="sb_publishable_5UoKt_tZaG1OnxJlgDPwsQ_-_l8U-O5";
  var sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
  var $=function(i){return document.getElementById(i)};
  var rows=[],kuota=24,dibuka=null,filt="all",term="";
  var FILTERS=[["all","Semua"],["Mahasiswa","Mahasiswa"],["Siswa/i SMK","SMK"],["Sudah punya usaha","Punya usaha"],["Belum punya usaha, tapi tertarik","Tertarik"]];

  function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  var tt;function toast(m,err){var t=$("toast");t.textContent=m;t.className=err?"err":"";t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3500)}
  function confirmBox(o){
    $("dT").textContent=o.title;$("dB").textContent=o.body;$("dYes").textContent=o.yes;
    var d=$("dlg");d.showModal();
    $("dNo").onclick=function(){d.close()};
    $("dYes").onclick=function(){d.close();o.onYes()};
  }
  function wib(s){return new Date(s).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+" WIB"}
  function isBaru(r){return Date.now()-new Date(r.created_at).getTime()<36e5}
  function match(r,f){return f==="all"||r.status===f||r.ide===f}

  function stats(){
    var n=rows.length,sisa=Math.max(kuota-n,0);
    $("qT").textContent=n;$("qK").textContent=kuota;$("qS").textContent=sisa;
    $("meterI").style.width=Math.min(100,kuota?n/kuota*100:0)+"%";$("meter").classList.toggle("full",n>=kuota);
    $("cMhs").textContent=rows.filter(function(r){return r.status==="Mahasiswa"}).length;
    $("cSmk").textContent=rows.filter(function(r){return r.status==="Siswa/i SMK"}).length;
    $("cPunya").textContent=rows.filter(function(r){return r.ide==="Sudah punya usaha"}).length;
    $("cTertarik").textContent=rows.filter(function(r){return r.ide!=="Sudah punya usaha"}).length;
  }
  function chips(){
    var box=$("chips");box.textContent="";
    FILTERS.forEach(function(f){
      var b=h("button","chip",f[1]);b.type="button";b.setAttribute("aria-pressed",filt===f[0]);
      b.appendChild(h("i",null,rows.filter(function(r){return match(r,f[0])}).length));
      b.onclick=function(){filt=f[0];chips();draw()};box.appendChild(b);
    });
  }
  function draw(){
    var L=$("list");L.textContent="";
    var t=term.toLowerCase().trim();
    var v=rows.filter(function(r){
      return match(r,filt)&&(!t||[r.nama,r.institusi,r.jurusan,r.kode,r.wa].join(" ").toLowerCase().indexOf(t)>-1);
    });
    $("cnt").textContent=v.length+" dari "+rows.length+" peserta";
    if(!v.length){var e=h("li","empty",rows.length?"Tidak ada peserta yang cocok.":"Belum ada pendaftar.");L.appendChild(e);return}
    v.forEach(function(r){
      var li=h("li","reg");if(isBaru(r))li.dataset.i="baru";
      var a=h("div","r1");a.appendChild(h("h3",null,r.nama));a.appendChild(h("span","kode",r.kode));li.appendChild(a);
      var tg=h("div","tags");tg.appendChild(h("span",null,r.status));tg.appendChild(h("span","b",r.ide));li.appendChild(tg);
      li.appendChild(h("p",null,r.institusi+" · "+r.jurusan+" · "+r.tingkat));
      var w=h("a","wa","+"+r.wa);w.href="https://wa.me/"+r.wa;w.target="_blank";w.rel="noopener";
      var p=h("p");p.appendChild(w);li.appendChild(p);
      var f=h("div","r3");f.appendChild(h("small",null,"Daftar "+wib(r.created_at)));
      var d=h("button","btn del","Hapus");d.type="button";d.onclick=function(){hapus(r)};f.appendChild(d);li.appendChild(f);
      L.appendChild(li);
    });
  }
  function hapus(r){
    confirmBox({title:"Hapus pendaftar?",body:r.nama+" ("+r.kode+") akan dihapus permanen dan slotnya kembali kosong.",yes:"Hapus",onYes:function(){
      sb.from("youngpreneur_peserta").delete().eq("id",r.id).select("id").then(function(res){
        if(res.error){toast("Gagal menghapus: "+res.error.message,1);return}
        if(!res.data||!res.data.length){toast("Tidak ada izin menghapus (cek policy RLS).",1);return}
        rows=rows.filter(function(x){return x.id!==r.id});stats();chips();draw();toast(r.nama+" dihapus");
      });
    }});
  }
  function status(){
    return sb.rpc("kuota_youngpreneur").then(function(r){
      var d=r.data&&r.data[0],b=$("toggle");
      if(r.error||!d){b.textContent="Tidak tersedia";$("rsT").textContent="Status pendaftaran tidak diketahui";$("rsP").textContent=r.error?r.error.message:"";return}
      dibuka=!!d.dibuka;kuota=d.kuota;stats();
      $("rs").dataset.s=dibuka?"open":"closed";b.disabled=false;
      $("rsT").textContent=dibuka?"Pendaftaran dibuka":"Pendaftaran ditutup";
      $("rsP").textContent=dibuka?"Form menerima pendaftar sampai slot penuh.":"Form tidak menerima pendaftar baru.";
      b.textContent=dibuka?"Tutup":"Buka";
    });
  }
  $("toggle").onclick=function(){
    confirmBox({title:dibuka?"Tutup pendaftaran?":"Buka pendaftaran?",body:dibuka?"Pendaftar baru tidak bisa mengirim form.":"Pendaftar baru bisa mengirim form kembali.",yes:dibuka?"Tutup":"Buka",onYes:function(){
      $("toggle").disabled=true;
      sb.rpc("set_pendaftaran_youngpreneur",{p_buka:!dibuka}).then(function(r){
        if(r.error){$("toggle").disabled=false;toast("Gagal: "+r.error.message,1);return}
        status().then(function(){toast(dibuka?"Pendaftaran dibuka":"Pendaftaran ditutup")});
      });
    }});
  };
  function load(){
    $("refresh").disabled=true;
    return sb.from("youngpreneur_peserta").select("*").order("created_at",{ascending:false}).then(function(r){
      $("refresh").disabled=false;
      if(r.error){toast("Gagal memuat data: "+r.error.message,1);return}
      rows=r.data||[];stats();chips();draw();return status();
    });
  }
  function csvCell(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
  $("csv").onclick=function(){
    if(!rows.length){toast("Belum ada data untuk diunduh",1);return}
    var head=["No","Kode","Nama","Status","WhatsApp","Kampus/Sekolah","Jurusan","Kelas/Semester","Minat Usaha","Waktu Daftar (WIB)"];
    var asc=rows.slice().reverse();
    var out=[head.map(csvCell).join(",")];
    asc.forEach(function(r,i){
      out.push([i+1,r.kode,r.nama,r.status,'="+'+r.wa+'"',r.institusi,r.jurusan,r.tingkat,r.ide,wib(r.created_at)].map(function(v,k){return k===4?v:csvCell(v)}).join(","));
    });
    var blob=new Blob(["\uFEFF"+out.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="youngpreneur-peserta-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  };
  $("refresh").onclick=function(){load().then(function(){toast("Data diperbarui")})};
  $("q").addEventListener("input",function(){term=this.value;draw()});
  $("out").onclick=function(){sb.auth.signOut().then(function(){location.replace("login.html")})};

  chips();draw();
  if(!sb){toast("Library Supabase gagal dimuat. Muat ulang halaman.",1);$("who").textContent="Tidak terhubung";return}
  sb.auth.getSession().then(function(r){
    var s=r.data.session;
    if(!s){location.replace("login.html");return}
    $("who").textContent="Masuk sebagai "+s.user.email;
    return sb.rpc("is_admin").then(function(a){
      if(a.error||a.data!==true){return sb.auth.signOut().then(function(){location.replace("login.html?denied=1")})}
      return load();
    });
  });
})();
</script>
</body>
</html>
